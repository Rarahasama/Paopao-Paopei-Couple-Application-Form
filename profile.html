<style>
:root{
  --paper:#FDF4F0;
  --ink:#2A2730;
  --ink-soft:#796E76;
  --rule:#D8C1BA;
  --pen:#1F4FA3;
  --stamp:#C21F35;

  --gutter:clamp(8px, 3.2vw, 16px);
  --pad-x:clamp(15px, 5vw, 24px);
  --pad-y:clamp(20px, 5.5vw, 28px);

  --fs-title:clamp(19px, 6.2vw, 26px);
  --fs-sub:clamp(11px, 3.2vw, 12.5px);
  --fs-body:clamp(14.5px, 4.1vw, 16px);
  --fs-hand:clamp(16px, 4.6vw, 18px);
  --fs-mono:clamp(10.5px, 3vw, 12px);
  --fs-btn:clamp(14.5px, 4.2vw, 16px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  min-height:100%;
  background:#E3CFC9;
  background-image:radial-gradient(circle at 20% 10%, #EFDDD8 0%, #DCC5BE 60%, #CDB4AD 100%);
  background-attachment:fixed;
  font-family:"Sarabun","Noto Sans Thai",-apple-system,sans-serif;
  color:var(--ink);
  display:flex;justify-content:center;
  overflow-x:hidden;
  padding:
    calc(var(--gutter) + env(safe-area-inset-top))
    calc(var(--gutter) + env(safe-area-inset-right))
    calc(var(--gutter) * 3 + env(safe-area-inset-bottom))
    calc(var(--gutter) + env(safe-area-inset-left));
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
body, .q, .lede, .rec, .foot, label{overflow-wrap:break-word;word-break:break-word}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;max-width:100%}

.sheet{
  width:100%;max-width:600px;position:relative;
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom, rgba(216,193,186,.16) 0 1px, transparent 1px 36px);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -18px rgba(60,30,30,.45);
  padding:var(--pad-y) var(--pad-x);
  overflow:hidden;
}
.sheet::before,.sheet::after{
  content:"";position:absolute;left:0;right:0;height:9px;pointer-events:none;
  background:radial-gradient(circle at 5px -2px, transparent 5px, var(--paper) 5.5px) 0 0/12px 9px repeat-x;
}
.sheet::before{top:0;transform:scaleY(-1)}
.sheet::after{bottom:0}

.masthead{border:1.5px solid var(--ink);padding:clamp(10px,3vw,13px) clamp(10px,3.4vw,14px);position:relative}
.masthead .corner{
  display:flex;justify-content:space-between;gap:8px;
  font-family:"Space Mono",monospace;font-size:clamp(9px,2.7vw,10.5px);letter-spacing:.08em;
  color:var(--ink-soft);text-transform:uppercase;line-height:1.4;
}
.masthead h1{font-size:var(--fs-title);font-weight:700;text-align:center;margin:clamp(6px,2vw,9px) 0 2px;line-height:1.25}
.masthead .sub{text-align:center;font-size:var(--fs-sub);color:var(--ink-soft);letter-spacing:clamp(.04em,1vw,.12em);line-height:1.5}
.tape{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-1.5deg);
  background:rgba(255,241,205,.85);border-left:1px dashed rgba(0,0,0,.12);border-right:1px dashed rgba(0,0,0,.12);
  width:clamp(80px,26vw,104px);height:22px;
}
.meta{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 14px;
  font-size:var(--fs-mono);color:var(--ink-soft);margin:10px 2px 0;
  font-family:"Space Mono",monospace;letter-spacing:.03em;line-height:1.6;
}
.meta b{font-family:"Sarabun",sans-serif;font-weight:600}
.stage{margin-top:clamp(14px,4vw,18px);min-height:clamp(300px,58vw,340px)}
.pen{font-family:"Charmonman","Sarabun",cursive;color:var(--pen);font-weight:700;line-height:1.5}

/* ---------- หน้าแรก ---------- */
.lede{font-size:var(--fs-body);margin-bottom:14px}
.lede strong{font-weight:600}
.notice{border:1px dashed var(--rule);padding:11px 13px;font-size:clamp(11.5px,3.3vw,12.5px);color:var(--ink-soft);margin-top:16px;line-height:1.65}
.notice b{color:var(--ink);font-weight:600}
.toc{list-style:none;margin:16px 0 0;font-size:clamp(12.5px,3.6vw,13.5px);color:var(--ink-soft);columns:2;column-gap:16px}
.toc li{padding:2px 0;break-inside:avoid}
.toc b{color:var(--ink);font-weight:600}

/* ---------- หัวหมวด ---------- */
.sechead{border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.sechead .no{font-size:clamp(11px,3.2vw,12px);letter-spacing:.16em;color:var(--stamp);font-weight:700}
.sechead h2{font-size:clamp(18px,5.4vw,22px);font-weight:700;line-height:1.3;margin-top:2px}
.sechead .desc{font-size:clamp(12px,3.5vw,13px);color:var(--ink-soft);line-height:1.55;margin-top:3px}

/* ---------- ช่องกรอก ---------- */
.field{margin-top:clamp(15px,4.4vw,19px)}
.field label{display:block;font-size:clamp(13px,3.8vw,14.5px);color:var(--ink);line-height:1.5;margin-bottom:3px;font-weight:600}
.field label .fno{color:var(--stamp);font-weight:700;margin-right:5px;font-size:.86em;letter-spacing:.04em}
.field .hint{display:block;font-size:clamp(11px,3.1vw,12px);color:var(--ink-soft);font-weight:400;line-height:1.5;margin-top:1px}
input[type=text], textarea{
  width:100%;background:transparent;border-radius:0;color:var(--pen);
  font-family:"Charmonman","Sarabun",cursive;font-weight:700;
  font-size:var(--fs-hand);outline:none;
}
input[type=text]{
  border:0;border-bottom:1.5px dotted var(--rule);
  padding:5px 2px 7px;line-height:1.6;
}
input[type=text]:focus{border-bottom-color:var(--pen)}
textarea{
  border:1px dotted var(--rule);padding:7px 9px;
  line-height:29px;min-height:94px;resize:vertical;display:block;
  background-image:repeating-linear-gradient(transparent 0 28px, rgba(216,193,186,.45) 28px 29px);
  background-attachment:local;background-position:0 8px;
}
textarea:focus{border-color:var(--pen);border-style:solid}
::placeholder{font-family:"Sarabun",sans-serif;font-size:clamp(12.5px,3.5vw,13.5px);font-weight:400;color:#C9B7B1}

/* ---------- แถบความคืบหน้า / ปุ่ม ---------- */
.progress{margin-top:clamp(20px,5vw,26px);display:flex;align-items:center;gap:9px}
.bar{flex:1 1 auto;min-width:0;height:5px;background:rgba(216,193,186,.5);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--pen);transition:width .35s cubic-bezier(.4,0,.2,1)}
.pct{font-size:clamp(10.5px,3vw,11.5px);color:var(--ink-soft);white-space:nowrap}
.navrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{
  font-family:inherit;font-size:var(--fs-btn);font-weight:600;cursor:pointer;
  padding:clamp(11px,3.2vw,13px) clamp(18px,5.4vw,24px);
  border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--pen);outline-offset:3px}
.btn-main{background:var(--stamp);border-color:var(--stamp);color:#fff;flex:1 1 auto}
.btn-ghost{border-style:dashed;color:var(--ink-soft)}
.btn-sm{font-size:clamp(12px,3.4vw,13px);padding:8px 14px}
.saved{font-size:clamp(10.5px,3vw,11.5px);color:var(--ink-soft);margin-top:9px;min-height:18px;font-style:italic}

/* ---------- หน้าสรุป ---------- */
.stampwrap{text-align:center;padding:10px 0 4px}
.stamp{
  display:inline-block;color:var(--stamp);border:3.5px solid var(--stamp);
  padding:8px clamp(14px,5vw,20px) 10px;font-size:clamp(22px,6.6vw,28px);font-weight:700;letter-spacing:.1em;
  transform:rotate(-8deg);mix-blend-mode:multiply;opacity:.88;line-height:1.3;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--stamp);
  animation:slam .5s cubic-bezier(.2,1.5,.4,1) both;
}
.stamp small{display:block;font-size:clamp(9px,2.6vw,11px);letter-spacing:.22em;font-weight:400;margin-top:1px}
@keyframes slam{
  0%{transform:rotate(-22deg) scale(3.2);opacity:0;filter:blur(3px)}
  70%{opacity:.95}
  100%{transform:rotate(-8deg) scale(1);opacity:.88;filter:blur(0)}
}
.sumsec{margin-top:22px}
.sumsec h3{font-size:clamp(12.5px,3.6vw,14px);letter-spacing:.06em;color:var(--ink);font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:6px}
.rec{padding:7px 0;border-bottom:1px dotted var(--rule)}
.rec .rq{font-size:clamp(12px,3.5vw,13px);color:var(--ink-soft);line-height:1.5}
.rec .ra{font-family:"Charmonman",cursive;font-weight:700;color:var(--pen);font-size:var(--fs-hand);line-height:1.5;white-space:pre-wrap}
.rec .blank{font-family:"Sarabun",sans-serif;font-weight:400;color:#C4B2AC;font-size:clamp(12px,3.4vw,13px)}
.signrow{display:flex;flex-wrap:wrap;gap:14px clamp(10px,3vw,16px);margin-top:24px;font-size:clamp(11px,3.2vw,12px);color:var(--ink-soft)}
.signrow > div{flex:1 1 130px;min-width:0;text-align:center}
.signline{border-bottom:1.5px dotted var(--rule);padding-bottom:4px;margin-bottom:5px;font-family:"Charmonman",cursive;color:var(--pen);font-size:clamp(15px,4.6vw,20px);font-weight:700;min-height:30px;line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.actions .btn{flex:1 1 auto}
.foot{margin-top:24px;text-align:center;font-size:clamp(10.5px,3vw,11.5px);color:#B9A7A1;line-height:1.6}
.homelink{color:var(--ink-soft);text-decoration:none;border-bottom:1px dotted var(--rule)}
.homelink:hover{color:var(--pen);border-bottom-color:var(--pen)}
.hide{display:none}

@media (max-width:360px){
  .masthead .corner{font-size:9px;letter-spacing:.04em}
  .tape{display:none}
  .toc{columns:1}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* ---------- สั่งพิมพ์ / บันทึกเป็น PDF ---------- */
@media print{
  body{background:#fff;padding:0;display:block}
  .sheet{max-width:none;box-shadow:none;background:#fff;padding:0 12mm}
  .sheet::before,.sheet::after,.tape,.actions,.navrow,.progress,.saved{display:none!important}
  .stamp{animation:none}
  .rec, .sumsec{break-inside:avoid}
}
</style>
</head>

/* ================================================================ */

const stage = document.getElementById('stage');
const metaFrom = document.getElementById('metaFrom');
const metaStatus = document.getElementById('metaStatus');
const THAI = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
const toThai = n => String(n).split('').map(d => THAI[+d]).join('');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'rk02-draft-v1';
const TOTAL = SECTIONS.reduce((n, s) => n + s.f.length, 0);

metaFrom.textContent = CONFIG.ผู้ขอข้อมูล;

let name = CONFIG.ผู้กรอก || '';
let answers = {};
let sec = 0;

/* ---- บันทึกร่างอัตโนมัติ (ถ้าเบราว์เซอร์ไม่ให้ ก็ยังใช้งานได้ปกติ) ---- */
function saveDraft(done){
  try{
    localStorage.setItem(KEY, JSON.stringify({ name, answers, sec }));
    localStorage.setItem('rk02-progress', JSON.stringify({
      filled: filledCount(), total: TOTAL, done: !!done
    }));
  }catch(e){}
}
function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && d.answers) return d;
  }catch(e){}
  return null;
}
function clearDraft(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function filledCount(){ return Object.values(answers).filter(v => String(v).trim()).length; }
function updateStatus(){
  const n = filledCount();
  metaStatus.textContent = n === 0 ? 'ยังไม่เริ่มกรอก'
    : n >= TOTAL ? 'ครบทุกข้อแล้ว' : `กรอกแล้ว ${toThai(n)}/${toThai(TOTAL)} ข้อ`;
}
function scrollTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- หน้าแรก ---------- */
function screenIntro(){
  const draft = loadDraft();
  const resume = draft && Object.values(draft.answers || {}).some(v => String(v).trim());
  stage.innerHTML = `
    <p class="lede">เรียน <span class="pen" id="hi">${esc(name) || 'ผู้กรอกแบบฟอร์ม'}</span><br>
      <span class="pen">${esc(CONFIG.ผู้ขอข้อมูล)}</span> ขอความร่วมมือกรอกแฟ้มประวัติฉบับนี้
      รวม <strong>${toThai(SECTIONS.length)} หมวด ${toThai(TOTAL)} ข้อ</strong>
      เพื่อใช้อ้างอิงตลอดไป ข้อไหนไม่อยากตอบข้ามได้ ไม่มีข้อบังคับ</p>

    <ol class="toc">${SECTIONS.map((s,i) =>
      `<li><b>หมวด ${toThai(i+1)}</b> ${s.t}</li>`).join('')}</ol>

    <div class="field" style="margin-top:20px">
      <label>ชื่อผู้กรอก</label>
      <input type="text" id="nameInput" placeholder="พิมพ์ชื่อของคุณ" value="${esc(name)}" autocomplete="off" spellcheck="false">
    </div>

    <div class="notice">
      <b>ระบบบันทึกร่างอัตโนมัติ</b> — พิมพ์ไปเรื่อย ๆ ได้เลย ปิดหน้าไปแล้วกลับมาต่อได้
      ข้อมูลเก็บไว้ในเครื่องของคุณเท่านั้น ไม่ถูกส่งไปที่ไหนทั้งสิ้น
      กรอกเสร็จค่อยกดคัดลอกหรือดาวน์โหลดส่งกลับเอง
    </div>

    <div class="navrow">
      <button class="btn btn-main" id="start">${resume ? 'กรอกต่อจากเดิม' : 'เริ่มกรอกแฟ้มประวัติ'}</button>
      ${resume ? '<button class="btn btn-ghost btn-sm" id="fresh">เริ่มใหม่ทั้งหมด</button>' : ''}
    </div>`;

  const input = document.getElementById('nameInput');
  const hi = document.getElementById('hi');
  input.addEventListener('input', () => {
    name = input.value.trim();
    hi.textContent = name || 'ผู้กรอกแบบฟอร์ม';
    saveDraft();
  });
  document.getElementById('start').addEventListener('click', () => {
    if (resume){ answers = draft.answers; name = draft.name || name; sec = draft.sec || 0; }
    updateStatus(); screenSection();
  });
  const fresh = document.getElementById('fresh');
  if (fresh) fresh.addEventListener('click', () => {
    if (confirm('ลบคำตอบที่กรอกไว้ทั้งหมดและเริ่มใหม่?')){
      answers = {}; sec = 0; clearDraft();
      try{ localStorage.removeItem('rk02-progress'); }catch(e){}
      updateStatus(); screenIntro();
    }
  });
}

/* ---------- หน้ากรอกแต่ละหมวด ---------- */
function screenSection(){
  const s = SECTIONS[sec];
  const done = SECTIONS.slice(0, sec).reduce((n, x) => n + x.f.length, 0);
  const pct = Math.round(done / TOTAL * 100);

  stage.innerHTML = `
    <div class="sechead">
      <div class="no">หมวด ${toThai(sec+1)} / ${toThai(SECTIONS.length)}</div>
      <h2>${s.t}</h2>
      <div class="desc">${s.d}</div>
    </div>

    ${s.f.map((f, i) => {
      const id = `q${sec}_${i}`;
      const val = esc(answers[id] || '');
      const label = `<label for="${id}"><span class="fno">${toThai(sec+1)}.${toThai(i+1)}</span>${f[0]}
        ${f[2] ? `<span class="hint">${f[2]}</span>` : ''}</label>`;
      return `<div class="field">${label}` + (f[1] === 'a'
        ? `<textarea id="${id}" data-id="${id}" rows="3" placeholder="พิมพ์คำตอบตรงนี้">${val}</textarea>`
        : `<input type="text" id="${id}" data-id="${id}" placeholder="พิมพ์คำตอบตรงนี้" value="${val}" autocomplete="off">`)
        + `</div>`;
    }).join('')}

    <div class="progress">
      <span class="pct">${toThai(pct)}%</span>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </div>
    <div class="navrow">
      ${sec > 0 ? '<button class="btn" id="prev">ย้อนกลับ</button>' : ''}
      <button class="btn btn-main" id="next">${sec < SECTIONS.length - 1 ? 'หมวดถัดไป' : 'ปิดแฟ้ม แล้วดูสรุป'}</button>
    </div>
    <div class="saved" id="saved"></div>`;

  const savedMsg = document.getElementById('saved');
  let timer;
  stage.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('input', () => {
      answers[el.dataset.id] = el.value;
      if (el.tagName === 'TEXTAREA'){
        el.style.height = 'auto';
        el.style.height = Math.max(94, el.scrollHeight + 4) + 'px';
      }
      clearTimeout(timer);
      timer = setTimeout(() => {
        saveDraft(); updateStatus();
        savedMsg.textContent = 'บันทึกร่างอัตโนมัติแล้ว';
        setTimeout(() => { savedMsg.textContent = ''; }, 1600);
      }, 500);
    });
    if (el.tagName === 'TEXTAREA' && el.value){
      el.style.height = 'auto';
      el.style.height = Math.max(94, el.scrollHeight + 4) + 'px';
    }
  });

  const prev = document.getElementById('prev');
  if (prev) prev.addEventListener('click', () => { sec--; saveDraft(); screenSection(); scrollTop(); });
  document.getElementById('next').addEventListener('click', () => {
    saveDraft(); updateStatus();
    if (sec < SECTIONS.length - 1){ sec++; screenSection(); scrollTop(); }
    else { screenSummary(); scrollTop(); }
  });
}

/* ---------- หน้าสรุป ---------- */
function buildText(){
  const today = new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
  const lines = [
    'แฟ้มประวัติส่วนตัว (ฟอร์ม รก.๐๒)',
    `ผู้กรอก: ${name || '—'}`,
    `ผู้ขอข้อมูล: ${CONFIG.ผู้ขอข้อมูล}`,
    `ลงวันที่ ${today}`,
    `กรอกครบ ${filledCount()} จาก ${TOTAL} ข้อ`, ''];
  SECTIONS.forEach((s, si) => {
    lines.push(`━━ หมวด ${toThai(si+1)} · ${s.t} ━━`);
    s.f.forEach((f, i) => {
      const v = (answers[`q${si}_${i}`] || '').trim();
      lines.push(`${toThai(si+1)}.${toThai(i+1)} ${f[0]}`);
      lines.push(`    ${v || '(ไม่ได้ตอบ)'}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

function screenSummary(){
  updateStatus();
  const today = new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
  saveDraft(true);

  stage.innerHTML = `
    <div class="stampwrap"><div class="stamp">บันทึกแล้ว<small>FILED</small></div></div>
    <p class="lede" style="text-align:center;margin-top:12px">${esc(CONFIG.ข้อความปิดท้าย)}</p>
    <div class="meta" style="justify-content:center">กรอกครบ ${toThai(filledCount())} จาก ${toThai(TOTAL)} ข้อ</div>

    ${SECTIONS.map((s, si) => `
      <div class="sumsec">
        <h3>หมวด ${toThai(si+1)} · ${s.t}</h3>
        ${s.f.map((f, i) => {
          const v = (answers[`q${si}_${i}`] || '').trim();
          return `<div class="rec"><div class="rq">${toThai(si+1)}.${toThai(i+1)} ${f[0]}</div>
            <div class="ra${v ? '' : ' blank'}">${v ? esc(v) : 'ไม่ได้ตอบ'}</div></div>`;
        }).join('')}
      </div>`).join('')}

    <div class="signrow">
      <div><div class="signline">${esc(name) || '—'}</div>ลงชื่อผู้กรอก</div>
      <div><div class="signline">${esc(CONFIG.ผู้ขอข้อมูล)}</div>ลงชื่อผู้รับแฟ้ม</div>
    </div>
    <div class="meta" style="justify-content:center;margin-top:12px">ลงวันที่ ${today}</div>

    <div class="actions">
      <button class="btn btn-main" id="copy">คัดลอกทั้งหมด</button>
      <button class="btn" id="dl">ดาวน์โหลดไฟล์</button>
      <button class="btn" id="print">บันทึกเป็น PDF</button>
    </div>
    <div class="navrow"><button class="btn btn-ghost btn-sm" id="back">กลับไปแก้คำตอบ</button></div>`;

  document.getElementById('copy').addEventListener('click', async e => {
    const text = buildText();
    try{ await navigator.clipboard.writeText(text); }
    catch{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    e.target.textContent = 'คัดลอกแล้ว ✓';
  });

  document.getElementById('dl').addEventListener('click', () => {
    const blob = new Blob(["\ufeff" + buildText()], { type:'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ประวัติ-${(name || 'ผู้กรอก').replace(/[\\/:*?"<>|]/g, '')}.txt`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  document.getElementById('print').addEventListener('click', () => window.print());
  document.getElementById('back').addEventListener('click', () => { sec = 0; screenSection(); scrollTop(); });
}

updateStatus();
screenIntro();
</script>
